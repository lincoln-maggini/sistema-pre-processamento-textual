<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Inicial - L&M Pré-Processamento</title>

    <link rel="stylesheet" href="assets/css/index.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://unpkg.com/petite-vue" defer></script>

</head>

<body v-scope="{ ...app }">

    <!-- cabeçalho -->

    <header class="header d-flex align-items-center p-3 border-bottom">
        <h1 class="h5 mb-0 text-secondary flex-grow-1 titulo">
            <a href="index.html">L&M Pré-Processamento Textual</a>
        </h1>
        <div class="d-flex align-items-center">
            <template v-if="isLoggedIn">
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle btn-custom" type="button"
                        data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i> <span v-text="userName"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end custom-dropdown-menu">
                        <li><a class="dropdown-item" href="usuario.html">
                                <i class="bi bi-person-vcard me-2"></i> Perfil
                            </a></li>
                        <li><button class="dropdown-item text-danger" @click="logout">
                                <i class="bi bi-box-arrow-right me-2"></i> Sair
                            </button></li>
                    </ul>
                </div>
            </template>
            <template v-else>
                <a href="login.html" class="btn btn-outline-secondary btn-custom me-2">Login / Cadastro</a>
            </template>
        </div>
    </header>
    <!-- conteúdo principal -->
    <main class="conteudo-principal container">
        <h1>Bem-vindo ao L&M Pré-Processamento Textual</h1>
        <p class="lead">Pré-processe seus textos, analise palavras e visualize gráficos interativos com facilidade.</p>
        <div>
            <a href="sistema.html" class="btn btn-success btn-lg btn-custom me-2">
                <i class="bi bi-graph-up"></i> Começar Agora
            </a>
        </div>
    </main>

    <!-- rodapé -->
    <footer class="bg-light text-center py-3 mt-auto">
        <p class="mb-0">&copy; 2025 Desenvolvido por Matheus Mendes e Lincoln Maggini</p>
    </footer>

    <!-- mensagem de erro -->
    <div class="modal fade" id="popupMensagem" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content popup-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="popupTitulo">Aviso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="popupMensagemTexto">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/sistema.js"></script>
</body>

</html>
